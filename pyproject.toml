[project]
name = "ml-bootcamp"
version = "0.1.0"
description = "43-week self-study roadmap to become a Junior ML Engineer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Phase 1 — data
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "seaborn>=0.13.2",
    # Phase 2–3 — classical ML
    "scikit-learn>=1.7",
    "scipy>=1.15",
    "joblib>=1.4",
    # Phase 4–5 — deep learning, NLP
    "torch>=2.7",
    "torchvision>=0.22",
    "transformers>=4.53",
    "datasets>=3.6",
    "sentence-transformers>=5.0",
    "opencv-python-headless>=4.11",
    # Phase 6 — serving, MLOps, database
    "fastapi>=0.116",
    "uvicorn>=0.35",
    "httpx>=0.28",
    "mlflow>=3.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "shap>=0.54.1",
]

[dependency-groups]
dev = [
    "jupytext>=1.19.6",
    "pytest>=8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlbootcamp"]

[tool.pytest.ini_options]
addopts = "-q"
