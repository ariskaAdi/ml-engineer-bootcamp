# Capstone: PostgreSQL + Python inference + Go gateway.
#   cp capstone/services/.env.example capstone/services/.env   (lalu ganti password)
#   uv run python capstone/services/inference/scripts/export_model.py
#   docker compose -f capstone/docker-compose.yml --env-file capstone/services/.env up --build -d --wait
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5434:5432"    # hanya untuk monitoring lokal
    volumes:
      - smsdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  inference:
    build: ./services/inference
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build: ./services/gateway-go
    environment:
      INFERENCE_URL: http://inference:8000
      INFERENCE_TIMEOUT: ${INFERENCE_TIMEOUT:-2s}
      FAIL_OPEN: ${FAIL_OPEN:-true}
    ports:
      - "8081:8081"
    depends_on:
      inference:
        condition: service_healthy

volumes:
  smsdata:
